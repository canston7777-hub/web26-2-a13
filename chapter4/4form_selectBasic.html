<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    
    <title>Document</title>
</head>
<body>
    <h2>4선택가능한 입력 양식</h2>
    <select>
        <option>김밥</option>
        <option>떡볶이</option>
        <option>순대</option>
        <option>오뎅</option>
    </select>

    <h2>5여러 항목 선택하기</h2>
    <select multiple="multiple">
        <option>김밥</option>
        <option>떡볶이</option>
        <option>순대</option>
        <option>오뎅</option>
    </select>

    <h2>선택 옵션 묶기</h2>
    <!--optgroup 힝-->
    <select>
        <optgroup label="HTML5">
            <option>multimedia tag</option>
            <option>connectivity</option>
            <option>device access</option>
        </optgroup>
        <optgroup label="CSS3">
            <option>animation</option>
            <option>3D transform</option>
        </optgroup>

    </select>
</body>
</html>
